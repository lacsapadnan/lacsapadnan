name: Refresh profile cards

on:
  workflow_dispatch:
  # Re-enable the daily run once Actions billing works again:
  # schedule:
  #   - cron: "17 17 * * *"   # 00:17 in Jakarta

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Refresh contribution data
        env:
          # A PAT with read:user stored as PROFILE_TOKEN includes private contributions,
          # like your profile graph. Without it the default token sees public ones only.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_data.py

      - name: Render cards
        run: python scripts/build_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards README.md
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "chore: refresh profile cards"
          git pull --rebase --autostash
          git push
